name: Enhanced Data Ingestion

on:
  schedule:
    # Run every 4 hours to keep data fresh
    - cron: '0 */4 * * *'
    # Also run at 2 AM UTC for daily full update
    - cron: '0 2 * * *'
  workflow_dispatch:  # Allow manual triggering

jobs:
  enhanced-data-ingestion:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
        
    - name: Install dependencies
      run: |
        cd backend
        pip install -r requirements.txt
        
    - name: Run data ingestion only (every 4 hours)
      if: github.event.schedule == '0 */4 * * *'
      env:
        SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
        SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        ENVIRONMENT: production
        REDIS_URL: ${{ secrets.REDIS_URL }}
        REDIS_ENABLED: true
      run: |
        cd backend
        python scripts/daily_automation.py --data-ingestion
        
    - name: Run full daily automation (at 2 AM)
      if: github.event.schedule == '0 2 * * *'
      env:
        SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
        SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        ENVIRONMENT: production
        REDIS_URL: ${{ secrets.REDIS_URL }}
        REDIS_ENABLED: true
      run: |
        cd backend
        python scripts/daily_automation.py --full
        
    - name: Upload automation results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: automation-results-${{ github.run_id }}
        path: backend/automation_results_*.json
        retention-days: 7
        
    - name: Notify on failure
      if: failure()
      uses: actions/github-script@v7
      with:
        script: |
          github.rest.issues.create({
            owner: context.repo.owner,
            repo: context.repo.repo,
            title: 'Enhanced Data Ingestion Failed',
            body: `Enhanced data ingestion failed on ${new Date().toISOString()}. Check the workflow run for details.`
          }) 